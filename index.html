<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Referrer Policy সেট করা হলো যাতে CDN থেকে ইমেজ ব্লক না করে -->
    <meta name="referrer" content="no-referrer">
    <title>Direct NFT Image Loader (1 - 7000)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .pagination-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 18px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background-color: #334155;
            cursor: not-allowed;
        }

        input {
            padding: 9px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: white;
            width: 100px;
            text-align: center;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 20px auto;
        }

        .card {
            background-color: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #0f172a;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .error-box {
            display: none;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background-color: #1e293b;
            color: #f87171;
            font-size: 13px;
            padding: 10px;
        }

        .retry-btn {
            background-color: #ef4444;
            padding: 5px 10px;
            font-size: 12px;
        }

        .direct-link {
            font-size: 11px;
            color: #38bdf8;
            text-decoration: underline;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <header>
        <h1>NFT Direct Viewer</h1>
        <p>মোট আইটেম: ৭,০০০টি (প্রতি পেজে ১০০টি করে দেখানো হচ্ছে)</p>

        <div class="pagination-controls">
            <button id="prev-btn" onclick="changePage(-1)">← আগের ১০০টি</button>
            <span>পেজ: <strong id="page-num">১</strong> / ৭০</span>
            <button id="next-btn" onclick="changePage(1)">পরের ১০০টি →</button>
            
            <span style="margin-left: 15px;">সরাসরি যান:</span>
            <input type="number" id="jump-id" min="1" max="7000" placeholder="ID (1-7000)">
            <button onclick="jumpToID()">Go</button>
        </div>
    </header>

    <div class="gallery-grid" id="gallery"></div>

    <script>
        const baseUrl = "https://2w4vanuecnlrmjhaorxhfn2c4bqarywouhmovqtqvpaqymp6lfaa.mainnet-1.datasprite-cdn.com/FPHjSMETs7eqAtoftL5b3zg4s9X8XDPSC1fe19dGARgs/";
        const itemsPerPage = 100;
        let currentPage = 1;

        function loadPage(page) {
            currentPage = page;
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = ''; // আগেরগুলো পরিষ্কার করা

            const startID = (page - 1) * itemsPerPage + 1;
            const endID = Math.min(page * itemsPerPage, 7000);

            document.getElementById('page-num').innerText = page;
            document.getElementById('prev-btn').disabled = (page === 1);
            document.getElementById('next-btn').disabled = (page === 70);

            for (let id = startID; id <= endID; id++) {
                const imgUrl = `${baseUrl}${id}.jpeg`;

                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${id}`;

                card.innerHTML = `
                    <div class="img-wrapper">
                        <img 
                            src="${imgUrl}" 
                            alt="NFT #${id}"
                            onerror="showError(${id})"
                        >
                        <div class="error-box" id="error-${id}">
                            <span>ছবি লোড হয়নি</span>
                            <button class="retry-btn" onclick="reloadSingleImg(${id})">🔄 রিফ্রেশ</button>
                            <a href="${imgUrl}" target="_blank" class="direct-link">সরাসরি লিংক খুলুন</a>
                        </div>
                    </div>
                    <div>
                        <strong>Item #${id}</strong>
                    </div>
                `;

                gallery.appendChild(card);
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showError(id) {
            const card = document.getElementById(`card-${id}`);
            if (card) {
                const img = card.querySelector('img');
                const errorBox = card.querySelector('.error-box');
                if (img) img.style.display = 'none';
                if (errorBox) errorBox.style.display = 'flex';
            }
        }

        function reloadSingleImg(id) {
            const card = document.getElementById(`card-${id}`);
            if (card) {
                const img = card.querySelector('img');
                const errorBox = card.querySelector('.error-box');
                
                errorBox.style.display = 'none';
                img.style.display = 'block';

                // Bypass cache with unique URL
                img.src = `${baseUrl}${id}.jpeg?t=${new Date().getTime()}`;
            }
        }

        function changePage(step) {
            const newPage = currentPage + step;
            if (newPage >= 1 && newPage <= 70) {
                loadPage(newPage);
            }
        }

        function jumpToID() {
            const id = parseInt(document.getElementById('jump-id').value);
            if (id >= 1 && id <= 7000) {
                const targetPage = Math.ceil(id / itemsPerPage);
                loadPage(targetPage);
            } else {
                alert('১ থেকে ৭০০০ এর মধ্যে আইডি লিখুন।');
            }
        }

        // প্রথম পেজ লোড
        loadPage(1);
    </script>
</body>
</html>
