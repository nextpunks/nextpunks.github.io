<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>NFT Collection Gallery & Downloader</title>

    <!-- JSZip and FileSaver CDN for Zip functionality -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }

        /* Stats Bar */
        .stats-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .stat-card {
            background-color: #1e293b;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            font-size: 0.95rem;
        }

        .stat-card span {
            font-weight: bold;
        }

        .text-success { color: #4ade80; }
        .text-danger { color: #f87171; }
        .text-info { color: #38bdf8; }

        /* Controls & Pagination */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 18px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0369a1;
        }

        button:disabled {
            background-color: #334155;
            cursor: not-allowed;
        }

        .btn-zip {
            background-color: #16a34a;
        }

        .btn-zip:hover {
            background-color: #15803d;
        }

        input {
            padding: 9px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: white;
            width: 100px;
            text-align: center;
            outline: none;
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 25px auto;
        }

        .card {
            background-color: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #0f172a;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .error-box {
            display: none;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background-color: #1e293b;
            color: #f87171;
            font-size: 12px;
            padding: 5px;
        }

        .retry-btn {
            background-color: #ef4444;
            padding: 6px 12px;
            font-size: 11px;
        }

        /* Modal View */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-caption {
            position: absolute;
            bottom: 20px;
            color: white;
            font-size: 1.1rem;
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>NFT Collection Gallery</h1>
        <p>Browsing 7,000 NFTs (100 items per page)</p>

        <!-- Live Counters -->
        <div class="stats-container">
            <div class="stat-card">Page Items: <span id="stat-total" class="text-info">0</span></div>
            <div class="stat-card">Loaded: <span id="stat-loaded" class="text-success">0</span></div>
            <div class="stat-card">Failed: <span id="stat-failed" class="text-danger">0</span></div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="prev-btn" onclick="changePage(-1)">← Previous</button>
            <span>Page <strong id="page-num">1</strong> / 70</span>
            <button id="next-btn" onclick="changePage(1)">Next →</button>
            
            <span style="margin-left: 10px;">Jump to ID:</span>
            <input type="number" id="jump-id" min="1" max="7000" placeholder="1-7000">
            <button onclick="jumpToID()">Go</button>

            <button id="download-btn" class="btn-zip" onclick="downloadLoadedZip()">📦 Download Loaded as ZIP</button>
        </div>
    </header>

    <div class="gallery-grid" id="gallery"></div>

    <!-- Image Modal Window -->
    <div class="modal" id="image-modal" onclick="closeModal()">
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="modal-img">
        <div class="modal-caption" id="modal-caption"></div>
    </div>

    <script>
        const baseUrl = "https://2w4vanuecnlrmjhaorxhfn2c4bqarywouhmovqtqvpaqymp6lfaa.mainnet-1.datasprite-cdn.com/FPHjSMETs7eqAtoftL5b3zg4s9X8XDPSC1fe19dGARgs/";
        const itemsPerPage = 100;
        let currentPage = 1;

        let loadedCount = 0;
        let failedCount = 0;
        const loadedImagesMap = new Map(); // Store loaded image Blobs for Zip

        function loadPage(page) {
            currentPage = page;
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = ''; 

            // Reset counters for current page
            loadedCount = 0;
            failedCount = 0;
            loadedImagesMap.clear();
            updateStats(itemsPerPage);

            const startID = (page - 1) * itemsPerPage + 1;
            const endID = Math.min(page * itemsPerPage, 7000);
            const totalPageItems = (endID - startID) + 1;

            document.getElementById('page-num').innerText = page;
            document.getElementById('prev-btn').disabled = (page === 1);
            document.getElementById('next-btn').disabled = (page === 70);

            updateStats(totalPageItems);

            for (let id = startID; id <= endID; id++) {
                const imgUrl = `${baseUrl}${id}.jpeg`;

                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${id}`;

                card.innerHTML = `
                    <div class="img-wrapper" onclick="openModal('${imgUrl}', ${id})">
                        <img 
                            src="${imgUrl}" 
                            alt="NFT #${id}"
                            onload="onImageLoad(${id}, '${imgUrl}')"
                            onerror="onImageError(${id})"
                        >
                        <div class="error-box" id="error-${id}">
                            <span>Failed to load</span>
                            <button class="retry-btn" onclick="event.stopPropagation(); reloadSingleImg(${id})">🔄 Refresh</button>
                        </div>
                    </div>
                    <div>
                        <strong>Item #${id}</strong>
                    </div>
                `;

                gallery.appendChild(card);
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Image Load Success Handler
        function onImageLoad(id, url) {
            loadedCount++;
            updateStats();

            // Fetch Blob data for future ZIP export
            fetch(url, { referrerPolicy: 'no-referrer' })
                .then(res => res.blob())
                .then(blob => {
                    loadedImagesMap.set(id, blob);
                })
                .catch(() => {
                    // Blob fetch fallback if direct fetch blocked
                });
        }

        // Image Load Fail Handler
        function onImageError(id) {
            failedCount++;
            updateStats();

            const card = document.getElementById(`card-${id}`);
            if (card) {
                const img = card.querySelector('img');
                const errorBox = card.querySelector('.error-box');
                if (img) img.style.display = 'none';
                if (errorBox) errorBox.style.display = 'flex';
            }
        }

        // Single Image Refresh
        function reloadSingleImg(id) {
            const card = document.getElementById(`card-${id}`);
            if (card) {
                const img = card.querySelector('img');
                const errorBox = card.querySelector('.error-box');
                
                errorBox.style.display = 'none';
                img.style.display = 'block';

                failedCount = Math.max(0, failedCount - 1);
                updateStats();

                // Reload with cache bypass
                const newUrl = `${baseUrl}${id}.jpeg?t=${new Date().getTime()}`;
                img.src = newUrl;
            }
        }

        // Update Live Statistics Counter
        function updateStats(totalItems) {
            if (totalItems !== undefined) {
                document.getElementById('stat-total').innerText = totalItems;
            }
            document.getElementById('stat-loaded').innerText = loadedCount;
            document.getElementById('stat-failed').innerText = failedCount;
        }

        // Page Switcher
        function changePage(step) {
            const newPage = currentPage + step;
            if (newPage >= 1 && newPage <= 70) {
                loadPage(newPage);
            }
        }

        // ID Jump
        function jumpToID() {
            const id = parseInt(document.getElementById('jump-id').value);
            if (id >= 1 && id <= 7000) {
                const targetPage = Math.ceil(id / itemsPerPage);
                loadPage(targetPage);
            } else {
                alert('Please enter an ID between 1 and 7000.');
            }
        }

        // Modal Zoom Functionality
        function openModal(url, id) {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            const modalCaption = document.getElementById('modal-caption');

            modal.style.display = 'flex';
            modalImg.src = url;
            modalCaption.innerText = `NFT #${id}`;
        }

        function closeModal() {
            document.getElementById('image-modal').style.display = 'none';
        }

        // ZIP Download Functionality (Saves as 1.png, 2.png, etc.)
        async function downloadLoadedZip() {
            if (loadedImagesMap.size === 0) {
                alert('No successfully loaded images available to download on this page yet.');
                return;
            }

            const zipBtn = document.getElementById('download-btn');
            const originalText = zipBtn.innerText;
            zipBtn.innerText = '⏳ Compiling ZIP...';
            zipBtn.disabled = true;

            const zip = new JSZip();

            // Add images to ZIP named as 1.png, 2.png, etc.
            loadedImagesMap.forEach((blob, id) => {
                zip.file(`${id}.png`, blob);
            });

            try {
                const content = await zip.generateAsync({ type: 'blob' });
                saveAs(content, `NFT_Collection_Page_${currentPage}.zip`);
            } catch (err) {
                alert('Error creating ZIP file. Please try again.');
            } finally {
                zipBtn.innerText = originalText;
                zipBtn.disabled = false;
            }
        }

        // Initial Load
        loadPage(1);
    </script>
</body>
</html>
