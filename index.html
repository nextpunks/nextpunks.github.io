<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptos NFT Explorer • 7000+ images</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- JSZip + FileSaver -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0b0f17;
            color: #f9fafb;
            min-height: 100vh;
            background-image: radial-gradient(circle at 15% 15%, rgba(0,229,153,0.05) 0%, transparent 40%),
                              radial-gradient(circle at 85% 85%, rgba(59,130,246,0.05) 0%, transparent 40%);
            background-attachment: fixed;
        }
        ::-webkit-scrollbar { width:8px; height:8px; }
        ::-webkit-scrollbar-track { background:#0b0f17; }
        ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:4px; }
        .container { max-width:1440px; margin:0 auto; padding:0 1.5rem; }
        
        header {
            background: rgba(11,15,23,0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            position: sticky; top:0; z-index:100;
            padding:0.8rem 0;
        }
        .header-content { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; }
        .brand { display:flex; align-items:center; gap:0.75rem; }
        .brand-logo {
            width:34px; height:34px;
            background: linear-gradient(135deg, #00e599, #3b82f6);
            border-radius:8px; display:grid; place-items:center;
            font-weight:800; color:#000;
        }
        h1 { font-size:1.3rem; font-weight:800; background:linear-gradient(135deg,#fff 30%,#9ca3af); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .subtitle { font-size:0.8rem; color:#9ca3af; }
        .badge {
            display:inline-flex; align-items:center; gap:0.3rem;
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.08);
            padding:0.25rem 0.7rem; border-radius:999px;
            font-size:0.7rem; color:#9ca3af;
        }
        .badge-dot { width:6px; height:6px; background:#00e599; border-radius:50%; box-shadow:0 0 8px #00e599; }

        .stats {
            display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
            gap:0.8rem; margin:1.5rem 0;
        }
        .stat-card {
            background:rgba(17,24,39,0.6); border:1px solid rgba(255,255,255,0.06);
            border-radius:12px; padding:1rem 1.2rem;
        }
        .stat-label { font-size:0.65rem; text-transform:uppercase; color:#6b7280; font-weight:600; }
        .stat-value { font-size:1.4rem; font-weight:700; }

        .download-bar {
            background:rgba(17,24,39,0.6); border:1px solid rgba(255,255,255,0.06);
            border-radius:12px; padding:0.8rem 1.2rem;
            display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
            margin-bottom:1.2rem;
        }
        .btn-download {
            background:linear-gradient(135deg,#00e599,#00b377);
            color:#000; font-weight:700; font-size:0.8rem;
            padding:0.6rem 1.2rem; border-radius:999px; border:none; cursor:pointer;
            display:inline-flex; align-items:center; gap:0.4rem;
            transition:0.2s;
        }
        .btn-download:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 4px 15px rgba(0,229,153,0.3); }
        .btn-download:disabled { opacity:0.3; cursor:not-allowed; background:#374151; color:#9ca3af; }

        .status-container {
            background:rgba(17,24,39,0.5); border:1px solid rgba(255,255,255,0.06);
            border-radius:12px; padding:0.8rem 1.2rem;
            margin-bottom:1.5rem;
            display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;
        }
        .status-left { display:flex; align-items:center; gap:0.8rem; }
        .spinner {
            width:22px; height:22px;
            border:2px solid rgba(255,255,255,0.08);
            border-top:2px solid #00e599;
            border-radius:50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        .progress-track { width:100%; height:3px; background:rgba(255,255,255,0.05); border-radius:2px; margin-top:0.6rem; }
        .progress-fill { height:100%; background:linear-gradient(90deg,#00e599,#3b82f6); width:0%; transition:width 0.2s; }

        .gallery {
            display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
            gap:1rem; margin:1.5rem 0;
        }
        @media (min-width:640px) { .gallery { grid-template-columns:repeat(3,1fr); } }
        @media (min-width:1024px) { .gallery { grid-template-columns:repeat(5,1fr); } }

        .nft-card {
            background:rgba(17,24,39,0.5); border:1px solid rgba(255,255,255,0.06);
            border-radius:12px; overflow:hidden; transition:0.2s;
        }
        .nft-card:hover { transform:translateY(-4px); border-color:rgba(0,229,153,0.3); box-shadow:0 0 20px rgba(0,229,153,0.05); }
        .nft-img {
            width:100%; aspect-ratio:1/1; object-fit:cover;
            background:rgba(0,0,0,0.3); cursor:pointer;
        }
        .nft-info { padding:0.6rem 0.8rem; }
        .nft-name { font-weight:600; font-size:0.8rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .nft-footer { display:flex; justify-content:space-between; align-items:center; margin-top:0.3rem; }
        .nft-id { font-family:'JetBrains Mono',monospace; font-size:0.65rem; color:#00e599; }
        .btn-dl-single {
            background:rgba(0,229,153,0.12);
            border:1px solid rgba(0,229,153,0.2);
            color:#00e599; font-size:0.65rem; font-weight:600;
            padding:0.15rem 0.6rem; border-radius:6px; cursor:pointer;
        }
        .btn-dl-single:hover { background:#00e599; color:#000; }

        .load-more { display:flex; justify-content:center; margin:1.5rem 0 3rem; }
        .btn-primary {
            background:linear-gradient(135deg,#00e599,#00b377);
            color:#000; font-weight:700; padding:0.7rem 2rem; border-radius:999px; border:none; cursor:pointer;
        }

        .modal-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.8); backdrop-filter:blur(10px);
            z-index:999; display:flex; align-items:center; justify-content:center;
            opacity:0; pointer-events:none; transition:0.3s;
        }
        .modal-overlay.open { opacity:1; pointer-events:auto; }
        .modal-box {
            background:#111827; border:1px solid rgba(255,255,255,0.08);
            border-radius:20px; max-width:700px; width:100%; max-height:90vh;
            padding:1.5rem; overflow-y:auto; position:relative;
        }
        .modal-close {
            position:absolute; top:0.8rem; right:1rem;
            background:transparent; border:none; color:#fff; font-size:1.5rem; cursor:pointer;
        }

        footer { border-top:1px solid rgba(255,255,255,0.06); padding:1.5rem 0; text-align:center; font-size:0.75rem; color:#6b7280; margin-top:2rem; }
    </style>
</head>
<body>

<header>
    <div class="container header-content">
        <div class="brand">
            <div class="brand-logo">A</div>
            <div>
                <h1>Aptos NFT Explorer</h1>
                <div class="subtitle">7000+ NFTs • download images as 1.png 2.png …</div>
            </div>
        </div>
        <div class="badge"><span class="badge-dot"></span>Aptos Mainnet</div>
    </div>
</header>

<main class="container">

    <div class="stats">
        <div class="stat-card"><div class="stat-label">Collection</div><div class="stat-value" id="collectionName">Loading...</div></div>
        <div class="stat-card"><div class="stat-label">Total NFTs</div><div class="stat-value" id="totalNfts">--</div></div>
        <div class="stat-card"><div class="stat-label">Loaded</div><div class="stat-value" id="loadedNfts">0</div></div>
    </div>

    <div class="download-bar">
        <div>
            <strong style="font-size:0.9rem;">📦 Download all images</strong>
            <div style="font-size:0.7rem; color:#9ca3af;" id="dlStatus">Waiting for NFTs to load...</div>
        </div>
        <button id="downloadAllBtn" class="btn-download" disabled>⬇ Download Images (.zip)</button>
    </div>

    <div class="status-container">
        <div class="status-left">
            <div class="spinner" id="spinner"></div>
            <div>
                <div id="statusState" style="font-weight:700; font-size:0.9rem;">Initializing</div>
                <div id="statusText" style="font-size:0.75rem; color:#9ca3af;">Fetching NFT list...</div>
            </div>
        </div>
        <div id="statusCount" style="font-family:'JetBrains Mono',monospace; font-size:0.85rem;">0 / 0</div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

    <div class="gallery" id="gallery"></div>

    <div class="load-more" id="loadMoreWrap" style="display:none;">
        <button id="loadMoreBtn" class="btn-primary">Load more</button>
    </div>

</main>

<!-- Modal -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <button class="modal-close" id="modalClose">&times;</button>
        <h2 id="modalTitle">NFT</h2>
        <div id="modalBody" style="font-size:0.85rem; color:#9ca3af; margin-top:0.8rem;"></div>
    </div>
</div>

<footer><div class="container">Aptos NFT Explorer • all images downloadable as 1.png, 2.png …</div></footer>

<script>
    // ---- CONFIG ----
    const COLLECTION = "0xef50cde1a5ffaea0cd0671a0f17de69ad6172eaaa673c8136d0a8e319ca9e946";
    const PAGE_SIZE = 40;

    const IPFS_GATEWAYS = [
        "https://ipfs.io/ipfs/",
        "https://gateway.pinata.cloud/ipfs/",
        "https://cloudflare-ipfs.com/ipfs/"
    ];
    const ARWEAVE = "https://arweave.net/";

    // ---- STATE ----
    let allNFTs = [];                // full array of { indexNum, name, image, id, uri }
    let displayedNFTs = [];
    let renderedCount = 0;
    let isLoading = false;
    let totalFetched = 0;
    let isComplete = false;

    // ---- DOM refs ----
    const $ = id => document.getElementById(id);
    const gallery = $('gallery');
    const loadMoreWrap = $('loadMoreWrap');
    const loadMoreBtn = $('loadMoreBtn');
    const downloadBtn = $('downloadAllBtn');
    const dlStatus = $('dlStatus');
    const statusState = $('statusState');
    const statusText = $('statusText');
    const statusCount = $('statusCount');
    const progressFill = $('progressFill');
    const spinner = $('spinner');
    const collectionName = $('collectionName');
    const totalNfts = $('totalNfts');
    const loadedNfts = $('loadedNfts');

    // ---- helpers ----
    function resolve(uri) {
        if (!uri) return '';
        uri = uri.trim();
        if (uri.startsWith('ipfs://')) return IPFS_GATEWAYS[0] + uri.slice(7);
        if (uri.startsWith('ar://')) return ARWEAVE + uri.slice(4);
        return uri;
    }

    async function fetchJSON(url, opts = {}) {
        const res = await fetch(url, opts);
        if (!res.ok) throw new Error(res.status);
        return res.json();
    }

    function updateStatus(label, text, current, total) {
        statusState.textContent = label;
        statusText.textContent = text;
        statusCount.textContent = `${current} / ${total}`;
        progressFill.style.width = total > 0 ? `${(current / total) * 100}%` : '0%';
    }

    // ---- fetch all tokens (pagination) ----
    async function fetchAllTokens(address) {
        let all = [];
        let offset = 0;
        const limit = 100;
        let hasMore = true;
        let fail = 0;

        while (hasMore) {
            try {
                const query = {
                    query: `
                        query GetTokens($addr: String!, $limit: Int!, $offset: Int!) {
                            current_token_datas_v2(
                                where: { collection_id: { _eq: $addr } }
                                limit: $limit
                                offset: $offset
                                order_by: { token_name: asc }
                            ) {
                                token_data_id
                                token_name
                                token_uri
                                description
                                current_collection { collection_name }
                            }
                        }
                    `,
                    variables: { addr: address, limit, offset }
                };
                const res = await fetchJSON('https://indexer.mainnet.aptoslabs.com/v1/graphql', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(query)
                });
                const tokens = res?.data?.current_token_datas_v2 || [];
                if (tokens.length === 0) { hasMore = false; break; }

                for (const t of tokens) {
                    all.push({
                        id: t.token_data_id || t.token_name,
                        name: t.token_name || 'NFT',
                        uri: t.token_uri || '',
                        description: t.description || '',
                        collection: t.current_collection?.collection_name || 'Aptos Collection'
                    });
                }
                offset += tokens.length;
                fail = 0;
                totalNfts.textContent = all.length;
                updateStatus('Discovering', `Fetched ${all.length} NFTs so far...`, all.length, all.length);
                if (tokens.length < limit) hasMore = false;
            } catch (e) {
                fail++;
                if (fail > 5) { hasMore = false; }
                else await new Promise(r => setTimeout(r, 1200));
            }
        }
        return all;
    }

    // ---- resolve metadata (only image) ----
    async function resolveImageOnly(token, index) {
        let image = '';
        let name = token.name || `NFT #${index}`;
        let uri = token.uri || '';

        if (uri) {
            try {
                const url = resolve(uri);
                const json = await fetchJSON(url);
                if (json) {
                    if (json.name) name = json.name;
                    const img = json.image || json.image_url || '';
                    image = resolve(img);
                }
            } catch (_) {
                // if metadata fails, try using token.uri as image
                image = resolve(uri);
            }
        }

        // if still no image, try raw uri
        if (!image && uri) image = resolve(uri);

        return {
            indexNum: index,
            name: name,
            image: image,
            id: token.id,
            uri: uri
        };
    }

    // ---- main ----
    async function start() {
        try {
            updateStatus('Fetching', 'Connecting to Aptos...', 0, 0);

            const raw = await fetchAllTokens(COLLECTION);
            if (raw.length === 0) {
                updateStatus('Error', 'No NFTs found', 0, 0);
                spinner.style.display = 'none';
                return;
            }

            // set collection name
            if (raw[0]?.collection) collectionName.textContent = raw[0].collection;

            totalNfts.textContent = raw.length;
            updateStatus('Loading metadata', `Resolving ${raw.length} images...`, 0, raw.length);

            // resolve in batches
            const batchSize = 30;
            for (let i = 0; i < raw.length; i += batchSize) {
                const batch = raw.slice(i, i + batchSize);
                const resolved = await Promise.all(batch.map((t, idx) => resolveImageOnly(t, i + idx + 1)));
                allNFTs.push(...resolved);
                totalFetched = allNFTs.length;
                loadedNfts.textContent = totalFetched;
                updateStatus('Loading', `Resolved ${totalFetched} / ${raw.length}`, totalFetched, raw.length);
            }

            // sort by indexNum
            allNFTs.sort((a,b) => a.indexNum - b.indexNum);
            isComplete = true;
            updateStatus('✅ Ready', `All ${allNFTs.length} NFTs loaded`, allNFTs.length, allNFTs.length);
            spinner.style.display = 'none';

            // enable download
            downloadBtn.disabled = false;
            dlStatus.textContent = `All ${allNFTs.length} images ready for download`;
            dlStatus.style.color = '#00e599';

            // render first batch
            renderedCount = 0;
            gallery.innerHTML = '';
            renderMore();

        } catch (err) {
            console.error(err);
            updateStatus('Error', 'Failed to load collection', 0, 0);
            spinner.style.display = 'none';
        }
    }

    // ---- render ----
    function renderMore() {
        const slice = allNFTs.slice(renderedCount, renderedCount + PAGE_SIZE);
        if (slice.length === 0) {
            loadMoreWrap.style.display = 'none';
            return;
        }

        for (const nft of slice) {
            const card = document.createElement('div');
            card.className = 'nft-card';
            card.innerHTML = `
                <img class="nft-img" src="${nft.image || ''}" alt="${nft.name}" loading="lazy" 
                     onerror="this.style.display='none'">
                <div class="nft-info">
                    <div class="nft-name">${nft.name}</div>
                    <div class="nft-footer">
                        <span class="nft-id">#${nft.indexNum}</span>
                        <button class="btn-dl-single" data-idx="${nft.indexNum}">⬇ PNG</button>
                    </div>
                </div>
            `;

            // modal on image click
            const img = card.querySelector('.nft-img');
            const nameEl = card.querySelector('.nft-name');
            const showModal = () => {
                $('modalTitle').textContent = nft.name;
                $('modalBody').innerHTML = `
                    <div style="margin-bottom:0.5rem;"><strong>Index:</strong> #${nft.indexNum}</div>
                    <div><strong>Image URL:</strong> <span style="word-break:break-all;">${nft.image || '—'}</span></div>
                    <div style="margin-top:0.8rem;"><strong>Raw URI:</strong> ${nft.uri || '—'}</div>
                `;
                $('modal').classList.add('open');
            };
            img.addEventListener('click', showModal);
            nameEl.addEventListener('click', showModal);

            // single download
            const dlBtn = card.querySelector('.btn-dl-single');
            dlBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                await downloadSingle(nft);
            });

            gallery.appendChild(card);
        }

        renderedCount += slice.length;
        loadedNfts.textContent = renderedCount;

        if (renderedCount < allNFTs.length) {
            loadMoreWrap.style.display = 'flex';
        } else {
            loadMoreWrap.style.display = 'none';
        }
    }

    // ---- single download ----
    async function downloadSingle(nft) {
        if (!nft.image) { alert('No image URL'); return; }
        const urls = [nft.image];
        if (nft.image.includes('ipfs/')) {
            const hash = nft.image.split('ipfs/')[1];
            IPFS_GATEWAYS.forEach(g => urls.push(g + hash));
        }
        for (const url of urls) {
            try {
                const res = await fetch(url, { mode: 'cors' });
                if (res.ok) {
                    const blob = await res.blob();
                    saveAs(blob, `${nft.indexNum}.png`);
                    return;
                }
            } catch (_) {}
        }
        alert('Failed to download image (CORS or unavailable)');
    }

    // ---- download all as ZIP ----
    async function downloadAllZip() {
        if (allNFTs.length === 0) return;
        downloadBtn.disabled = true;
        dlStatus.textContent = 'Downloading images in parallel...';

        const zip = new JSZip();
        const folder = zip.folder('images');

        const total = allNFTs.length;
        let completed = 0;
        const concurrency = 15;
        let idx = 0;

        async function worker() {
            while (idx < total) {
                const i = idx++;
                const nft = allNFTs[i];
                const num = nft.indexNum;
                let success = false;
                let blob = null;

                const urls = [nft.image];
                if (nft.image && nft.image.includes('ipfs/')) {
                    const hash = nft.image.split('ipfs/')[1];
                    IPFS_GATEWAYS.forEach(g => urls.push(g + hash));
                }

                for (const url of urls) {
                    try {
                        const res = await fetch(url, { mode: 'cors' });
                        if (res.ok) {
                            blob = await res.blob();
                            success = true;
                            break;
                        }
                    } catch (_) {}
                }

                if (success && blob) {
                    folder.file(`${num}.png`, blob);
                } else {
                    folder.file(`${num}.txt`, `Image not available: ${nft.image || 'no url'}`);
                }

                completed++;
                dlStatus.textContent = `Downloading images: ${completed} / ${total}`;
            }
        }

        const workers = [];
        for (let i = 0; i < Math.min(concurrency, total); i++) workers.push(worker());
        await Promise.all(workers);

        dlStatus.textContent = 'Compressing ZIP...';
        const content = await zip.generateAsync({ type: 'blob' });
        saveAs(content, 'aptos_nft_images.zip');
        dlStatus.textContent = `✅ Downloaded ${total} images as 1.png, 2.png ...`;
        downloadBtn.disabled = false;
    }

    // ---- events ----
    loadMoreBtn.addEventListener('click', renderMore);
    downloadBtn.addEventListener('click', downloadAllZip);
    $('modalClose').addEventListener('click', () => $('modal').classList.remove('open'));
    $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) $('modal').classList.remove('open'); });

    // ---- start ----
    start();
</script>
</body>
</html>
